<h1>Harbord Home</h1>
<p>Harbord Home is a privately run Home Assistant installation serving one household. It connects to Google Nest devices owned by that household so they can be monitored and controlled from Home Assistant.</p>
<p>It is not offered to the public and has no user sign-up.</p>
